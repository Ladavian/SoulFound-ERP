name: icewine-erp

# 只需要这一个容器：应用 + SQLite 数据库都在一起。
# 反向代理（Nginx / Caddy / Traefik / 群晖反代 …）由你自己在外层做，
# 容器内监听 8123，直接反代到它即可。
#
# 两种用法（同一份文件，靠 .env 里的 ERP_IMAGE 切换）：
#
#   A. 在服务器上直接构建（默认，不需要登录任何镜像仓库）
#        docker compose up -d --build
#
#   B. 使用 GitHub Actions 构建好的双架构镜像
#        .env 里设置：
#          ERP_IMAGE=ghcr.io/ladavian/soulfound-erp:latest
#          ERP_PULL_POLICY=always
#        docker login ghcr.io -u Ladavian      # 私有包需要 PAT（read:packages）
#        docker compose pull && docker compose up -d
#
#    提示：A 模式下本地镜像名在仓库里不存在，`docker compose pull` 会报找不到，
#    这是正常的，改用 --build 即可。

services:
  erp:
    # A 模式用本地名字（构建产出），B 模式指向 GHCR
    image: "${ERP_IMAGE:-icewine-erp:${ERP_VERSION:-1.0.0}}"
    build:
      context: .
      args:
        VERSION: "${ERP_VERSION:-1.0.0}"
        GO_VERSION: "${GO_VERSION:-1.26}"
    container_name: icewine-erp
    restart: unless-stopped
    pull_policy: "${ERP_PULL_POLICY:-missing}"
    ports:
      # 宿主机端口默认 8123；只想本机访问就把 ERP_BIND 改成 127.0.0.1
      - "${ERP_BIND:-0.0.0.0}:${ERP_PORT:-8123}:8123"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      ERP_APP_NAME: "${ERP_APP_NAME:-加拿大冰酒 ERP}"
      ERP_ADDR: ":8123"
      ERP_DATA_DIR: /data
      ERP_ADMIN_USERNAME: "${ERP_ADMIN_USERNAME:-admin}"
      ERP_ADMIN_PASSWORD: "${ERP_ADMIN_PASSWORD:-admin123}"
      ERP_CURRENCY: "${ERP_CURRENCY:-CAD}"
      ERP_CURRENCY_SYMBOL: "${ERP_CURRENCY_SYMBOL:-C$}"
      ERP_LOW_STOCK: "${ERP_LOW_STOCK:-6}"
      ERP_SESSION_HOURS: "${ERP_SESSION_HOURS:-72}"
      # 外层挂了 HTTPS 之后请改成 1，Cookie 就只通过加密连接传输
      ERP_COOKIE_SECURE: "${ERP_COOKIE_SECURE:-0}"
      # 首次启动写入演示数据（正式使用保持 0）
      ERP_SEED_DEMO: "${ERP_SEED_DEMO:-0}"
    volumes:
      # 数据库、备份、会话密钥都在这里，备份就是拷这个目录
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
