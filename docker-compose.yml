# SoulFound ERP —— 用 GitHub 编译好的镜像，复制即用
#
#   docker compose pull
#   docker compose up -d
#
# 打开 http://设备IP:8123   admin / admin123
# 数据在同目录 ./data（首次启动自动创建），备份就是拷这个目录。
#
# 镜像同时包含 amd64 与 arm64，设备会自动选对架构，不需要任何登录。
# 这个文件不用改：能调的设置都在网页「系统设置」里。

services:
  erp:
    image: ghcr.io/ladavian/soulfound-erp:latest
    container_name: icewine-erp
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./data:/data
