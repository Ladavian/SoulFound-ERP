# 加拿大冰酒 ERP
#
# 在 clone 下来的目录里执行：
#   docker compose up -d
# 打开 http://设备IP:8123   admin / admin123
#
# 数据在同目录 ./data（备份就是拷这个目录）。首次启动会编译镜像，约 1-3 分钟。
# 想用 GitHub 预构建好的镜像（免编译）见 docker-compose.ghcr.yml。

services:
  erp:
    build: .
    image: icewine-erp:local
    container_name: icewine-erp
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./data:/data
