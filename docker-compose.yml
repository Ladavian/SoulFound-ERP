# 复制到任意装了 Docker 的设备，执行：docker compose up -d
# 打开 http://设备IP:8123   admin / admin123
# 数据在同目录 ./data，备份就是拷这个目录

services:
  erp:
    image: ghcr.io/ladavian/soulfound-erp:latest
    container_name: icewine-erp
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./data:/data
