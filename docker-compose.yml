# 加拿大冰酒 ERP —— 复制到设备上，一行命令启动
#
#   docker compose up -d
#
# 打开 http://设备IP:8123 ，用 admin / admin123 登录（登录后请立刻改密码）。
#
# 数据存在同目录的 ./data 下（首次启动自动创建），备份就是拷这个目录。
# 升级：docker compose pull && docker compose up -d
#
# 这个文件不需要改：能调的设置都在网页「系统设置」里。

services:
  erp:
    image: ghcr.io/ladavian/soulfound-erp:latest
    container_name: icewine-erp
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - ./data:/data
