{{define "content"}}
{{$u := .Target}}

<div class="page-head">
  <div class="page-head__main">
    <div class="page-head__title">重置密码</div>
  </div>
  <div class="page-head__actions">
    <a class="btn" href="/users">{{template "icon" "back"}}<span>返回用户列表</span></a>
  </div>
</div>

<div class="alert alert--info">
  {{template "icon" "info"}}
  <div class="alert__body">
    管理员重置密码后，请把新密码安全地告知该用户；用户登录后可在「我的账号」自行修改。
  </div>
</div>

<form method="post" action="{{.FormAction}}">
  <div class="card">
    <div class="card__head">
      <div class="card__title">设置新密码<span class="card__sub">正在为该账号重置：{{$u.DisplayName}} · @{{$u.Username}}</span></div>
    </div>
    <div class="card__body">
      <div class="form-grid">
        <div class="field">
          <label class="field__label" for="password">新密码<span class="req">*</span></label>
          <input class="input" id="password" name="password" type="password" required autofocus
                 autocomplete="new-password" placeholder="至少 6 位">
          <div class="field__hint">至少 6 位。建议不要用生日或纯数字。</div>
        </div>
        <div class="field">
          <label class="field__label" for="confirm_password">确认新密码<span class="req">*</span></label>
          <input class="input" id="confirm_password" name="confirm_password" type="password" required
                 autocomplete="new-password" placeholder="再输入一次">
          <div class="field__hint">两次输入必须一致。</div>
        </div>
      </div>
    </div>
    <div class="card__foot" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div class="small muted">重置后该用户的旧密码立即失效，已登录的会话不受影响。</div>
      <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn" href="/users">取消</a>
        <button class="btn btn--primary" type="submit">{{template "icon" "save"}}<span>重置密码</span></button>
      </div>
    </div>
  </div>
</form>
{{end}}
