{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{.Title}} · {{.Cfg.AppName}}</title>
<meta name="theme-color" content="#0F2A24">
<meta name="color-scheme" content="light">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="/static/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{.Settings.CompanyName}}">
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/app.js" defer></script>
</head>
<body>
<div class="auth">
  <div class="auth__card">
    <div class="auth__logo">{{template "icon" "glass"}}</div>
    <h1 class="auth__title">{{.Settings.CompanyName}}</h1>
    <div class="auth__sub">加拿大冰酒 · 进销存与市集利润管理</div>

    {{if .Error}}<div class="alert alert--error">{{template "icon" "alert"}}<div class="alert__body">{{.Error}}</div></div>{{end}}

    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="next" value="{{.Next}}">
      <div class="field" style="margin-bottom:12px">
        <label class="field__label" for="username">账号</label>
        <input class="input" id="username" name="username" type="text" value="{{.Username}}"
               autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
      </div>
      <div class="field" style="margin-bottom:18px">
        <label class="field__label" for="password">密码</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">{{template "icon" "logout"}}<span>登录</span></button>
    </form>

    <div class="auth__hint">
      首次使用请用管理员账号登录（见部署说明或服务器环境变量）。<br>
      忘记密码可在服务器上执行 <span class="mono">erp reset-password</span> 重置。
    </div>
  </div>
</div>
</body>
</html>
{{end}}
