name: build

# 触发条件：
#   - 推送到 main / master：跑测试 + 构建双架构镜像（打 latest 与 sha 标签）
#   - 打 v* 标签：额外打上版本号标签（例如 v1.2.0 -> 1.2.0 / 1.2 / 1 / latest）
#   - Pull Request：只跑测试，不推送镜像
#   - 也可以在 Actions 页面手动触发
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支的重复触发只保留最新一次，避免浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # 镜像名必须全小写，而仓库名可能含大写（例如 SoulFound-ERP），
  # 所以下面在小写化之后再使用。
  IMAGE_NAME_RAW: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- 测试
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: 检查代码格式
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w cmd internal ："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 运行测试
        run: |
          echo "包含：金额与数量精度、移动加权平均成本、采购到岸成本分摊、"
          echo "市集结算与撤销、库存不足拦截、页面渲染、权限隔离、导出文件校验。"
          go test -timeout 300s -v ./... 2>&1 | tail -60

  # ---------------------------------------------------------------- 多架构镜像
  image:
    name: 构建镜像 (amd64 + arm64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 计算小写镜像名
        id: repo
        run: echo "name=${IMAGE_NAME_RAW,,}" >> "$GITHUB_OUTPUT"

      - name: 计算版本号
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          # 两种架构打在同一个标签下（manifest list），
          # 服务器拉取时会自动选择匹配的架构
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 临时诊断步骤：确认包是否与仓库关联，以及 GITHUB_TOKEN 能否修改包可见性
      - name: 诊断包可见性
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- 1) 仓库关联的包列表 ---"
          gh api "/repos/${{ github.repository }}/packages?package_type=container" 2>&1 | head -20 || true
          echo "--- 2) 用 GITHUB_TOKEN 尝试改个人作用域包可见性 ---"
          gh api --method PATCH "/user/packages/container/soulfound-erp" \
            -H "Accept: application/vnd.github+json" -f visibility=public 2>&1 | head -20 || true
          echo "--- 3) 尝试仓库作用域接口 ---"
          gh api --method PATCH "/repos/${{ github.repository }}/packages/container/soulfound-erp" \
            -H "Accept: application/vnd.github+json" -f visibility=public 2>&1 | head -20 || true
          echo "--- 4) 当前可见性 ---"
          gh api "/user/packages/container/soulfound-erp" 2>&1 | head -10 || true

      - name: 汇总
        run: |
          {
            echo "### ✅ 镜像已构建"
            echo ""
            echo "**版本**：\`${{ steps.ver.outputs.value }}\`"
            echo ""
            echo "**架构**：\`linux/amd64\`、\`linux/arm64\`"
            echo ""
            echo "**标签**："
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------- 单文件二进制（可选下载）
  # 不想用 Docker 时，可以直接下载对应架构的二进制在服务器上跑。
  binary:
    name: 构建二进制 (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, goarch: amd64, expect: x86-64 }
          - { arch: aarch64, goarch: arm64, expect: aarch64 }
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: 交叉编译静态二进制
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.buildVersion=${{ github.ref_name }}" \
            -o "erp-linux-${{ matrix.arch }}" ./cmd/erp

      # 注意：交叉编译出来的二进制不能在构建机上执行（架构不同，会 exit 126），
      # 所以这里用 file / go version -m 校验，而不是运行它。
      - name: 校验产物
        run: |
          set -eux
          bin="erp-linux-${{ matrix.arch }}"
          ls -lh "$bin"
          file "$bin"
          file "$bin" | grep -q "${{ matrix.expect }}"
          file "$bin" | grep -q "statically linked"
          go version -m "$bin" | head -5

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: erp-linux-${{ matrix.arch }}
          path: erp-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
